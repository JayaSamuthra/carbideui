<div
  [class]="panelClasses"
  role="dialog"
  aria-modal="false"
  [attr.aria-label]="ariaLabel"
  [attr.aria-hidden]="!expanded"
  [attr.inert]="expanded ? null : ''"
  [style.--ngcc-header-panel-width]="width() || null"
>
  <div class="ngcc-header-panel__body"><ng-content /></div>
  <div class="ngcc-header-panel__footer"><ng-content select="[ngccPanelFooter]" /></div>
</div>
