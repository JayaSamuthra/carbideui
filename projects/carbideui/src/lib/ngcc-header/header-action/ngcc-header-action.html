<ng-container *ngIf="href; else buttonTemplate">
  <a
    class="cds--header__action"
    [href]="href"
    [attr.aria-label]="accessibleLabel || null"
    [attr.aria-expanded]="active ? 'true' : 'false'"
    (click)="onClick($event)"
  >
    <ngcc-icon [name]="iconName ?? 'add'" [decorative]="true" />
  </a>
</ng-container>
<ng-template #buttonTemplate>
  <ngcc-button
    variant="ghost"
    [iconOnly]="true"
    [iconName]="iconName"
    [ariaLabel]="accessibleLabel"
    [ariaExpanded]="active"
    [className]="'cds--header__action' + (active ? ' cds--header__action--active' : '')"
    (click)="onClick($event)"
  />
</ng-template>
@if (hasBadge) {
  <span
    class="ngcc-header-action__badge"
    [class.ngcc-header-action__badge--dot]="badge === 'dot'"
    aria-hidden="true"
    >{{ badgeText }}</span
  >
}
