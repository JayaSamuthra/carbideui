<li role="none">
  @if (routerLink) {
    <a
      [class]="linkClasses()"
      role="menuitem"
      [routerLink]="resolvedHref()"
      [attr.tabindex]="tabIndex"
      [attr.aria-current]="isCurrentPage ? 'page' : null"
      (click)="onClick($event)"
      (keydown)="onKeydown($event)"
    >
      <ng-content />
    </a>
  } @else {
    <a
      [class]="linkClasses()"
      role="menuitem"
      [href]="resolvedHref()"
      [attr.tabindex]="tabIndex"
      [attr.aria-current]="isCurrentPage ? 'page' : null"
      (click)="onClick($event)"
      (keydown)="onKeydown($event)"
    >
      <ng-content />
    </a>
  }
</li>
